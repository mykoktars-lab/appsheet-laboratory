
name: Build Appsheet Lab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Extract project ZIP
        run: |
          unzip -o Appsheet_Lab_Lengkap.zip
          ls -la appsheet_lab

      - name: Install dependencies
        working-directory: appsheet_lab
        run: npm install

      - name: Build web application
        working-directory: appsheet_lab
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Prepare Android folder
        working-directory: appsheet_lab
        run: |
          rmdir android 2>/dev/null || true

      - name: Generate Android project
        working-directory: appsheet_lab
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: appsheet_lab/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appsheet-lab-debug-apk
          path: appsheet_lab/android/app/build/outputs/apk/debug/app-debug.apk
